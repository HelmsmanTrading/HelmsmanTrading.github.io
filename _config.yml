faq_en:
  - question: "Is Helmsman Trading open for public use?"
    answer: "Helmsman Trading is a proprietary, professional-grade algorithmic trading framework. It is designed for institutional and advanced retail quants who need absolute resilience and risk management."
  - question: "Which brokers are supported?"
    answer: "Currently, the L5 Broker Bridge supports Alpaca (Live/Paper) and Tradier. A local PaperSim environment is also included for offline backtesting."
  - question: "How does the Risk Engine work?"
    answer: "The L4 Risk Engine acts as a gatekeeper. It enforces maximum heat limits, position sizing, and dynamic stop-losses independently of your strategy's logic, preventing catastrophic drawdowns."
  - question: "Do I need external libraries for indicators?"
    answer: "No. The L1 Data Lake natively consolidates data and computes resilient VWAPs and other indicators locally, ensuring your strategies run fast and reliably."
faq_it:
  - question: "Helmsman Trading è disponibile al pubblico?"
    answer: "Helmsman Trading è un framework di trading algoritmico proprietario e professionale. È progettato per quant istituzionali e retail avanzati che richiedono resilienza assoluta e gestione del rischio."
  - question: "Quali broker sono supportati?"
    answer: "Attualmente, il Broker Bridge L5 supporta Alpaca (Live/Paper) e Tradier. È incluso anche un ambiente PaperSim locale per il backtesting offline."
  - question: "Come funziona il Risk Engine?"
    answer: "Il Risk Engine L4 agisce come un guardiano. Applica limiti massimi di esposizione, dimensionamento delle posizioni e stop-loss dinamici indipendentemente dalla logica della tua strategia, prevenendo drawdown catastrofici."
  - question: "Ho bisogno di librerie esterne per gli indicatori?"
    answer: "No. Il Data Lake L1 consolida nativamente i dati e calcola VWAP resilienti e altri indicatori in locale, assicurando che le tue strategie vengano eseguite in modo rapido e affidabile."


