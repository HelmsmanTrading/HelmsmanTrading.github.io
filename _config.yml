faq_it:
  - question: "Devo saper programmare?"
    answer: "No. Helmsman è per chi fa trading, non per chi scrive bot. Vedi le proposte, leggi size e stop, dici di sì o di no. Il codice resta sotto il cofano."
  - question: "Apre da solo, senza di me?"
    answer: "No. Prima vedi l'anteprima (titolo, direzione, size, stop, target). Solo se confermi parte l'ordine. Tu tieni il timone: Helmsman non è un autopilota."
  - question: "Cosa significa «posizione coperta»?"
    answer: "Ogni ingresso esce con protezione: stop, e target quando la regola lo prevede. Niente market nudi «poi metto lo stop». Se il broker o la regola non coprono, Helmsman non apre."
  - question: "L'AI decide quanto comprare?"
    answer: "No. Un modello può aiutarti a leggere il contesto; size e stop li calcola il motore di rischio, con regole fisse sul tuo conto. Niente quantità inventate in chat."
  - question: "Quali broker?"
    answer: "Oggi il ponte vivo è Alpaca in paper. L'architettura è fatta per attaccare ogni broker che espone API: non sei sposato a un unico conto. Man mano che un adapter è pronto, lo colleghi senza cambiare modo di decidere."
  - question: "Opera già con soldi veri?"
    answer: "L'accesso anticipato è paper. Il live arriva quando il ponte, le coperture e le regole di ingaggio sono all'altezza. Non vendiamo magia sul capitale reale."
  - question: "Su quali mercati cerca?"
    answer: "Titoli e ETF liquidi, dove entrare e uscire ha senso. Se una regola non è applicabile — prezzo sotto la media, mercato morto, dati stantii — non inventa il trade: lo salta."
  - question: "Quanto costa?"
    answer: "Siamo in accesso anticipato: lasci l'email, ti diciamo quando il paper è pronto per te. Niente listino finto, niente carta di credito per «provare»."

faq_en:
  - question: "Do I need to code?"
    answer: "No. Helmsman is for traders, not bot authors. You see proposals, read size and stop, say yes or no. The stack stays under the hood."
  - question: "Does it trade without me?"
    answer: "No. You get a preview (symbol, side, size, stop, target). The order goes out only if you confirm. You hold the helm: this is not autopilot."
  - question: "What is a «covered» position?"
    answer: "Every entry ships with protection: a stop, and a target when the rule calls for one. No naked market orders with a promise to add the stop later. If the broker or the rule cannot cover, Helmsman does not open."
  - question: "Does the AI pick position size?"
    answer: "No. A model can help you read context; size and stops come from the risk engine, with fixed rules on your account. No quantities invented in chat."
  - question: "Which brokers?"
    answer: "The live bridge today is Alpaca paper. The product is built to plug into every broker that offers an API — you are not married to one venue. As adapters land, you connect them without changing how you decide."
  - question: "Is this live money already?"
    answer: "Early access is paper. Live comes when the bridge, the covers, and the engagement rules are ready. We do not sell magic on real capital."
  - question: "Which markets does it scan?"
    answer: "Liquid names and ETFs, where getting in and out is realistic. If a rule does not apply — price under the average, dead tape, stale data — it skips the trade. It does not invent one."
  - question: "What does it cost?"
    answer: "Early access: leave your email, we tell you when paper is ready for you. No fake price list, no credit card to «try it»."

