faq_it:
  - question: "Chi esegue l’ordine — e di chi è la responsabilità?"
    answer: "Il broker sul tuo conto è l’esecutore finale. Helmsman è middleware: traduce, veta, inoltra. L’LLM (Claude o altro) può sbagliare; tu tieni il sì e le chiavi. Non siamo consulenti, non siamo il modello, non siamo il venue. Se l’ordine esiste, esiste dopo il tuo sì — e la responsabilità del capitale resta tua."
  - question: "Quali skill ci sono?"
    answer: "Cinque long-only: ATR-BREAKOUT (trend), CONNORS-MR (compra il dip), VOL-SQUEEZE (compressione), QUALITY-DIP (megacap ipervendute), AVWAP-RETEST (reclaim istituzionale). Il catalogo è in rapido sviluppo: altre in coda, validate sui mercati liquidi di riferimento prima di entrare. Non sono tip: sono bool sì/no sul nastro."
  - question: "Su quali ticker gira?"
    answer: "Su un universo curato di 52 titoli e ETF liquidi — tech, blue chip, settori, indici e metalli. Non screenerà diecimila simboli: le skill funzionano dove il book esiste. Dettaglio nella pagina Universo."
  - question: "Devo saper programmare?"
    answer: "No. Helmsman è per chi fa trading, non per chi scrive bot. Vedi le proposte, leggi size e stop, dici di sì o di no. Il codice resta sotto il cofano."
  - question: "Apre da solo, senza di me?"
    answer: "No. Prima vedi l'anteprima (titolo, direzione, size, stop, target). Solo se confermi parte l'ordine. Tu tieni il timone: Helmsman non è un autopilota."
  - question: "Cosa significa «posizione coperta»?"
    answer: "Ogni ingresso esce con protezione: stop, e target quando la regola lo prevede. Niente market nudi «poi metto lo stop». Se il broker o la regola non coprono, Helmsman non apre."
  - question: "L'AI decide quanto comprare?"
    answer: "No. Un modello può aiutarti a leggere il contesto; size e stop li calcola il motore di rischio, con regole fisse sul tuo conto. Niente quantità inventate in chat."
  - question: "Quali broker?"
    answer: "Oggi in codice ci sono Alpaca (paper) e Tradier (sandbox), più un banco locale PaperSim. Skill e adapter broker sono in rapido sviluppo: IBKR, Schwab, Directa, Fineco, DEGIRO e gli altri sono in mappa. Un adapter nuovo porta le sue regole, non una copia di Alpaca."
  - question: "Opera già con soldi veri?"
    answer: "Siamo in accesso anticipato. Quando un cliente è dentro, opera in paper: non è un self-serve. Il live arriva quando il ponte, le coperture e le regole di ingaggio sono all'altezza. Non vendiamo magia sul capitale reale."
  - question: "Su quali mercati cerca?"
    answer: "Titoli e ETF liquidi, dove entrare e uscire ha senso. Se una regola non è applicabile — prezzo sotto la media, mercato morto, dati stantii — non inventa il trade: lo salta."
  - question: "Quanto costa?"
    answer: "Siamo in accesso anticipato. Skill e adapter broker sono in rapido sviluppo. Puoi pre-registrarti: lasci email e venue, ti scriviamo se e quando c'è un posto. Niente listino finto, niente carta di credito per «provare»."
  - question: "Dopo l'ingresso gestisce la posizione?"
    answer: "No. Helmsman apre coperto e si ferma. Gestire la posizione è disciplina tua. Non vendiamo trailing automatico né un bot notturno."
  - question: "I loghi dei broker sono partnership?"
    answer: "No. I marchi nominano i venue degni di nota. Oro sulla tile = adapter già in codice (Alpaca, Tradier). Grigio = in mappa. Nessuna finta integrazione certificata."
  - question: "Devo aprire un conto nuovo?"
    answer: "No. Il conto resta tuo. Il ponte si allunga verso il broker che usi già. Nella pre-registrazione indica quale: è la coda, non un pitch."

faq_en:
  - question: "Who executes the order — and who is liable?"
    answer: "The broker on your account is the final executor. Helmsman is middleware: it translates, vetoes, forwards. The LLM (Claude or other) can be wrong; you hold the yes and the keys. We are not advisers, not the model, not the venue. If the order exists, it exists after your yes — and capital risk stays yours."
  - question: "Which skills are live?"
    answer: "Five long-only: ATR-BREAKOUT (trend), CONNORS-MR (buy the dip), VOL-SQUEEZE (compression), QUALITY-DIP (oversold megacaps), AVWAP-RETEST (institutional reclaim). The catalog is moving fast: more in the queue, validated on liquid reference markets before they ship. Not tips: yes/no bools on the tape."
  - question: "Which tickers does it scan?"
    answer: "A curated universe of 52 liquid names and ETFs — tech, blue chips, sectors, indexes and metals. It will not screen ten thousand symbols: skills work where the book exists. Detail on the Universe page."
  - question: "Do I need to code?"
    answer: "No. Helmsman is for traders, not bot authors. You see proposals, read size and stop, say yes or no. The stack stays under the hood."
  - question: "Does it trade without me?"
    answer: "No. You get a preview (symbol, side, size, stop, target). The order goes out only if you confirm. You hold the helm: this is not autopilot."
  - question: "What is a «covered» position?"
    answer: "Every entry ships with protection: a stop, and a target when the rule calls for one. No naked market orders with a promise to add the stop later. If the broker or the rule cannot cover, Helmsman does not open."
  - question: "Does the AI pick position size?"
    answer: "No. A model can help you read context; size and stops come from the risk engine, with fixed rules on your account. No quantities invented in chat."
  - question: "Which brokers?"
    answer: "In code today: Alpaca (paper) and Tradier (sandbox), plus a local PaperSim bench. Skills and broker adapters are moving fast: IBKR, Schwab, Directa, Fineco, DEGIRO and the rest are on the map. A new adapter brings its own rules, not an Alpaca copy."
  - question: "Is this live money already?"
    answer: "We are in early access. When a client is in, they operate in paper: it is not self-serve. Live comes when the bridge, the covers, and the engagement rules are ready. We do not sell magic on real capital."
  - question: "Which markets does it scan?"
    answer: "Liquid names and ETFs, where getting in and out is realistic. If a rule does not apply — price under the average, dead tape, stale data — it skips the trade. It does not invent one."
  - question: "What does it cost?"
    answer: "We are in early access. Skills and broker adapters are moving fast. You can pre-register: leave email and venue, we write if and when there is a seat. No fake price list, no credit card to «try it»."
  - question: "Does it manage the position after entry?"
    answer: "No. Helmsman opens covered and stops. Managing the position is your discipline. We do not sell automatic trailing or an overnight bot."
  - question: "Are the broker logos a partnership?"
    answer: "No. The marks name notable venues. Gold on the tile = adapter already in code (Alpaca, Tradier). Grey = on the map. No fake certified integration."
  - question: "Do I need a new account?"
    answer: "No. The account stays yours. The bridge lengthens toward the broker you already use. On the pre-registration, name which one: that is the queue, not a pitch."

