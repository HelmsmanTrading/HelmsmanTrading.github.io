# Helmsman design tokens — source of truth for CSS/Tailwind
# Human rules live in BRANDBOOK.md. Do not add a third gold.

color:
  navy: "#0B1F3A"
  ink: "#081628"
  surface: "#12263F"
  gold: "#C4A35A"
  gold_light: "#D4B87A"
  paper: "#F7F4EE"
  muted: "#8A9BB0"
  indigo: "#3D5A9E"      # sim / workshop, not CTA
  green: "#3D8B6E"       # success only
  friction: "#C48A3A"
  blocked: "#B45353"
  veto: "#fca5a5"
  sea_deeper: "#050d18"  # catalog islands

type:
  family: Inter
  display: Inter
  mono: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  weights: [400, 500, 600, 700, 800, 900]
  kicker:
    case: uppercase
    tracking_em: 0.3
    color: gold
  cta:
    weight: 700
    fill: gold
    ink: navy

logo:
  mark: /assets/images/logo/logo-mark.svg
  lockup_light: /assets/images/logo/logo-light.png
  lockup_dark: /assets/images/logo/logo-dark.png
  wordmark: HELMSMAN
  descriptor: TRADING
  hub: gold
  do_not: ["Helmsman AI", "Helmsman Bot", "rotate header mark", "gold on gold"]

radius:
  panel: 0.25rem
  cta: 9999px

motion:
  goldline: "gold-scan 3.5s ease-in-out infinite"
  marquee: "broker-marquee 42s linear infinite"
