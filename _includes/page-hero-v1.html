<section class="page-hero">
  <div class="page-hero__goldline"></div>
  <div class="absolute right-[-40px] top-24 opacity-40 hidden lg:block">{% include helm-wheel.html %}</div>
  <div class="max-w-5xl mx-auto relative z-10">
    {% if include.kicker %}<p class="text-sm font-mono text-brand-gold uppercase tracking-[0.3em] mb-5">{{ include.kicker }}</p>{% endif %}
    <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6">{{ include.title }}</h1>
    {% if include.lead %}<p class="text-xl text-gray-300 max-w-3xl leading-relaxed">{{ include.lead }}</p>{% endif %}
  </div>
</section>
