<section class="page-hero{% if include.extra_class %} {{ include.extra_class }}{% endif %}" aria-label="{{ include.kicker | default: 'Helmsman' }}">
  <div class="page-hero__goldline"></div>
  <div class="max-w-6xl mx-auto relative z-10 flex flex-col lg:flex-row lg:items-center gap-10 lg:gap-16">
    <div class="min-w-0 flex-1">
      {% if include.kicker %}
      <p class="text-sm font-mono text-brand-gold uppercase tracking-[0.3em] mb-5">{{ include.kicker }}</p>
      {% endif %}
      <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6">{{ include.title }}</h1>
      {% if include.lead %}
      <p class="text-xl text-gray-300 max-w-3xl leading-relaxed">{{ include.lead }}</p>
      {% endif %}
    </div>

    <figure class="page-hero__course">
      <div class="page-hero__compass" aria-hidden="true">
        <svg width="220" height="220" viewBox="0 0 400 400" fill="none">
          <defs>
            <linearGradient id="mhGold" x1="80" y1="40" x2="320" y2="360" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#E8D5A3"/>
              <stop offset="55%" stop-color="#C4A35A"/>
              <stop offset="100%" stop-color="#8A7038"/>
            </linearGradient>
          </defs>
          <g stroke="url(#mhGold)" stroke-linecap="round" opacity="0.45" stroke-width="1.5">
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(0 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(15 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(30 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(45 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(60 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(75 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(90 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(105 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(120 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(135 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(150 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(165 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(180 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(195 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(210 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(225 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(240 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(255 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(270 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(285 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(300 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(315 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(330 200 200)"/>
            <line x1="200" y1="22" x2="200" y2="36" transform="rotate(345 200 200)"/>
          </g>
          <circle cx="200" cy="200" r="172" stroke="rgba(196,163,90,0.22)" stroke-width="0.75"/>
          <circle cx="200" cy="200" r="138" stroke="rgba(196,163,90,0.14)" stroke-width="0.75" stroke-dasharray="1.2 8"/>
          <circle cx="200" cy="200" r="102" stroke="rgba(196,163,90,0.32)" stroke-width="1"/>
          <g>
            <circle cx="200" cy="200" r="172" stroke="url(#mhGold)" stroke-width="1.35" stroke-dasharray="22 1060" stroke-linecap="round"/>
            <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="28s" repeatCount="indefinite"/>
          </g>
          <g>
            <circle cx="200" cy="200" r="56" stroke="#C4A35A" stroke-width="5.5"/>
            <g transform="rotate(0 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(45 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(90 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(135 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(180 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(225 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(270 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <g transform="rotate(315 200 200)"><rect x="197.2" y="54" width="5.6" height="30" rx="2.8" fill="#C4A35A"/><circle cx="200" cy="52" r="6.4" fill="#C4A35A"/></g>
            <circle cx="200" cy="200" r="17" fill="#C4A35A"/>
            <circle cx="200" cy="200" r="6.5" fill="#0B1F3A"/>
            <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="48s" repeatCount="indefinite"/>
          </g>
          <g>
            <line x1="200" y1="38" x2="200" y2="198" stroke="#E8D5A3" stroke-width="1.35" stroke-linecap="round"/>
            <circle cx="200" cy="38" r="2.8" fill="#E8D5A3"/>
            <animateTransform attributeName="transform" type="rotate" values="-3.2 200 200; 2.6 200 200; -3.2 200 200" dur="9s" repeatCount="indefinite"/>
          </g>
        </svg>
      </div>
      <figcaption class="page-hero__course-legend">{% if page.lang == 'it' %}La rotta resta tua{% else %}The course stays yours{% endif %}</figcaption>
    </figure>
  </div>
</section>
